spring.application.name=RuneStone Treasury
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://127.0.0.1:3306/runestone_treasury?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=15000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=${PORT:8081}
spring.config.import=optional:file:.env[.properties]

# CORS allowed origins (supports comma-separated list or wildcard pattern with credentials)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5174,http://127.0.0.1:5173,*}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${APP_USERNAME:test@example.com}
spring.mail.password=${APP_PASSWORD:test}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

jwt.secret=${JWT_SECRET:runestone_treasury_jwt_hs256_secret_key_minimum_256_bits_2024}
jwt.expiration-ms=${JWT_EXPIRATION:900000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoints.enabled-by-default=true

# Kafka Messaging Queue
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}}
spring.kafka.listener.auto-startup=true
spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-on-first-bootstrap-down=false
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=runestone-treasury-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.runestone.treasury.*
spring.kafka.consumer.auto-offset-reset=earliest
