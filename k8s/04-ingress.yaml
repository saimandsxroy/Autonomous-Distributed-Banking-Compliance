apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foureyes-ingress
  namespace: foureyes
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: app.foureyes.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: foureyes-server-service
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: foureyes-client-service
                port:
                  number: 80
