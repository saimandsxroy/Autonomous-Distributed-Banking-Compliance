apiVersion: apps/v1
kind: Deployment
metadata:
  name: foureyes-client
  namespace: foureyes
  labels:
    app: foureyes-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: foureyes-client
  template:
    metadata:
      labels:
        app: foureyes-client
    spec:
      containers:
        - name: client
          image: foureyes/treasury-client:v1.0.0
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: foureyes-client-service
  namespace: foureyes
spec:
  type: ClusterIP
  selector:
    app: foureyes-client
  ports:
    - port: 80
      targetPort: 80
